MessageCenterSettings:
  description: "Message Center settings. The lists are JSON texts."
  properties:
    title:
      type: string
    rgbColor:
      type: integer
      format: int64
    logSize:
      description: "Messages kept in the log"
      type: integer
    historyEnabled:
      description: "1 the log is kept in the history file (messagecenter/history.jsonl in the application data folder) and is there again when the message center starts; 0 the log is in memory only. One message center keeps the history"
      type: integer
    historyMaxMB:
      description: "Size limit of the history file in MB (1 to 10000). Over it the file is written again with the newest messages of the log, up to half the limit"
      type: integer
    claimTimeoutSec:
      description: "A page given to a transmitter that does not claim it in this time goes back to the queue"
      type: integer
    silentSec:
      description: "A channel that does not announce itself for this time is offline"
      type: integer
    routes:
      description: "JSON array of routes, in order: name, enabled, stop, sinks (log, queue or a sink added; the captures of regExp are given to the actions) and filter (protocols, aliases, sources (channels, api or a source name), direction, kind, polarity, speeds, address and text (regular expressions the whole field must match), msgType, matchField (0 address, 1 message, 2 protocol, 3 type, 4 channel, 5 any) with regExp (a regular expression the field must match, anywhere in it), frequencyMin, frequencyMax, timeFrom, timeTo, hideDuplicates, voiceOnly). Each record is checked against all the routes in order: every route that selects it sends it to its sinks, one with stop ends the check. The log is a sink: a message no route sends to it is not logged. Default: one route without a filter to the log"
      type: string
    sinks:
      description: "JSON array of the sinks the routes send records to: name and type. file (the default): path and format (0 JSON lines, 1 CSV). udp: address, port and format (0 the Pager demodulator fields each ended by a NUL, 1 the record as one line of JSON). command: text, a command whose arguments get the message (${address}, ${message}, ${protocol}, ${type}, ${channel}, ${mode}, ${id}, ${frequency}, ${time} and ${0}, ${1}... the captures of the regular expression of the route); at most 5 are run in a second. speech: text said by the GUI. highlight: color (ARGB integer) of the row of the message in the log of the GUI. map: the position (latitude and longitude) in the text of the message is plotted on the Map, named by the address"
      type: string
    sources:
      description: "JSON array of the sources records are read from: name and type. file (the default): a JSON lines file, path. csv: a CSV log of a message center or of the Pager demodulator, path. udp: address (default 127.0.0.1) and port to listen on, datagrams as JSON lines or in the Pager demodulator format; what is received is a message received, never a page to transmit"
      type: string
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIFeatureSetIndex:
      type: integer
      description: "Feature-set index used by the reverse API peer."
    reverseAPIFeatureIndex:
      type: integer
      description: "Feature index used by the reverse API peer."

MessageCenterReport:
  description: "Message Center report. The lists are JSON texts."
  properties:
    logged:
      description: "Records stored in the log since the start"
      type: integer
    routed:
      description: "Records a route selected since the start"
      type: integer
    endpoints:
      description: "JSON array of the channels that announced themselves: alias, role (rx, tx), status (offline, idle, busy), protocols, speeds, polarities, queueDepth, capacity, frequency, lastSeen"
      type: string
    pages:
      description: "JSON array of the pages: id, transmitter, protocol, address, text, state (pending, queued, claimed, transmitted, sent, dead), attempts, retransmits, reason"
      type: string
    log:
      description: "JSON array of the last 50 records of the log (MessageRecord)"
      type: string
    errors:
      description: "Errors of the sinks and sources since the last report, one a line"
      type: string
    sinks:
      description: "JSON array of what each sink took: name, accepted and failed (log and queue too)"
      type: string

MessageCenterPost:
  description: "A page to transmit. The transmitter is the channel alias it announced. A page is for a modulator that handles its protocol. No live voice: a voice page is a sound file"
  properties:
    id:
      description: "Id of the page, optional (generated if empty). The records of the message have this id"
      type: string
    transmitter:
      description: "Alias of the transmitter channel"
      type: string
    protocol:
      description: "pocsag, flex or gsc"
      type: string
    address:
      description: "POCSAG: the address. FLEX: the capcode, digits or a form with letters of STD-43A Appendix A ([P|Q|R|S][fff][b]<letter><address>, e.g. 3E005237593); only the address is sent. GSC: the cap code, up to 6 digits zero padded (index, group, 3 address digits; 5 digits: index 0) or 7 digits with the suffix digit, that gives the function (1-4 and 5-8: A-D, 9 and 0: A and B) over function"
      type: string
    function:
      description: "POCSAG function 0 to 3 (A to D). GSC function 0 to 3 (A to D), the address number 1 to 4"
      type: integer
    priority:
      description: "FLEX: priority address (1 for yes)"
      type: integer
    type:
      description: "alphanumeric, numeric, tone, voice (GSC), short_message (FLEX, see shortType), special_numeric, numbered_numeric, numbered_special_numeric (FLEX numeric vectors 100 and 111), binary (FLEX HEX/binary, text of hex digits) or secure (FLEX, see secureType)"
      type: string
    shortType:
      description: "FLEX short_message type (STD-43A Table 3.9.2-1): 0 numeric, text up to 3 digits (8 for a long address), no text is the tone only payload; 1 source code; 2 source code and message number"
      type: integer
    source:
      description: "FLEX short_message types 1 and 2: source code 0 to 7"
      type: integer
    blocking:
      description: "FLEX binary: blocking length B, bits of a character 1 to 16; 0 or omitted: 1"
      type: integer
    mailDrop:
      description: "FLEX binary: mail drop flag M (1 for yes)"
      type: integer
    rightToLeft:
      description: "FLEX binary: display direction D, 1 right to left (not with a blocking length of 1)"
      type: integer
    headerMessage:
      description: "FLEX binary: header message flag H (1 for yes)"
      type: integer
    statusInfo:
      description: "FLEX binary: status information field enabler I (1 for yes)"
      type: integer
    secureType:
      description: "FLEX secure type t1 t0 (STD-43A 3.10.1.4): 0 alphanumeric, 1 data defined separately (hex digits), 2 binary (hex digits)"
      type: integer
    groupMembers:
      description: "FLEX group message (STD-43A 5.2): the capcodes of the pagers, 2 to 5461, separated by commas (digits or the forms with letters of STD-43A Appendix A, only the address is used). The address is not used. The transmitter sends a short instruction to each pager, then the message to a temporary address"
      type: string
    retransmit:
      description: "Transmitter in network mode: copies sent after the message (POCSAG 0 to 10; FLEX 0 to 15, numbered types with message numbering, same number and R = 0). The page is sent with its first transmission"
      type: integer
    retransmitInterval:
      description: "Seconds between the copies, 0 to 3600. Negative or omitted: the default of the transmitter (POCSAG 10 s, FLEX 128 frames)"
      type: number
      format: float
    sendDelay:
      description: "Transmitter in network mode: seconds from its queueing to the first transmission, 0 to 3600"
      type: number
      format: float
    text:
      description: "The text of the message"
      type: string
    charset:
      description: "Alphanumeric: the codepage of the text in the protocol of the page. Omitted: the codepage of the transmitter for the protocol"
      $ref: "http://swgserver:8081/api/swagger/include/RadioPagingCharset.yaml#/RadioPagingCharset"
    voiceFile:
      description: "voice: the path of the WAV file, on the host of SDRangel"
      type: string
    speed:
      description: "POCSAG speed in baud: 512, 1200 or 2400. 0: the channel setting"
      type: integer
    polarity:
      description: "normal or inverted. Empty: the channel setting"
      type: string

MessageCenterActions:
  description: "Message Center actions. One at a time"
  properties:
    post:
      $ref: "http://swgserver:8081/api/swagger/include/MessageCenter.yaml#/MessageCenterPost"
    requeue:
      description: "Id of a dead page: it goes back to pending with its attempts reset"
      type: string
    cancel:
      description: "Id of a page nobody has claimed or a dead page: it is withdrawn"
      type: string
    clearSent:
      description: "1: the pages that were sent are forgotten"
      type: integer
    ingest:
      description: "A message record as JSON (one or more lines): it goes through the routes as if a channel had published it, as a message received"
      type: string
    importFile:
      description: "Path of a JSON lines or CSV file (a log of a message center or of the Pager demodulator) read once into the log: not routed, so no action is taken on it"
      type: string
    redecode:
      $ref: "http://swgserver:8081/api/swagger/include/MessageCenter.yaml#/MessageCenterRedecode"

MessageCenterRedecode:
  description: "A received message of the log decoded again: POCSAG and GSC from their message bits, with another codepage or as the other type; FLEX alphanumeric from its characters, with another codepage. The record of the log is replaced"
  properties:
    id:
      description: "Id of the record"
      type: string
    charset:
      description: "Codepage of the protocol of the record. Omitted: the codepage of the record"
      $ref: "http://swgserver:8081/api/swagger/include/RadioPagingCharset.yaml#/RadioPagingCharset"
    type:
      description: "alphanumeric or numeric (POCSAG and GSC). Omitted: the type of the record"
      type: string
