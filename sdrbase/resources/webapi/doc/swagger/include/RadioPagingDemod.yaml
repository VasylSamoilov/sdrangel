RadioPagingDemodSettings:
  description: "Radio paging demodulator: POCSAG, FLEX and GSC; a protocol that is on is decoded at every speed, mode and polarity"
  type: object
  properties:
    inputFrequencyOffset:
      description: Channel center frequency shift from baseband center in Hz
      type: integer
      format: int64
    rfBandwidth:
      description: Channel filter bandwidth in Hz. Each protocol filters further at its Carson bandwidth
      type: number
      format: float
    pocsagEnabled:
      description: "Decode POCSAG (1 for yes, 0 for no)"
      type: integer
      format: int32
    pocsagDeviation:
      description: POCSAG frequency deviation in Hz
      type: number
      format: float
    flexEnabled:
      description: "Decode FLEX (1 for yes, 0 for no)"
      type: integer
      format: int32
    flexDeviation:
      description: FLEX outer symbol frequency deviation in Hz
      type: number
      format: float
    gscEnabled:
      description: "Decode GSC (1 for yes, 0 for no)"
      type: integer
      format: int32
    gscDeviation:
      description: GSC frequency deviation in Hz
      type: number
      format: float
    gscVoiceTimeout:
      description: Maximum length of a GSC voice message in seconds
      type: integer
      format: int32
    gscAudio:
      description: "Play the voice of GSC voice pages (1 for yes, 0 for no)"
      type: integer
      format: int32
    gscVoiceRecord:
      description: "Record the voice of GSC voice pages to a WAV file, the path is voice_file in the protocol data of the message record (1 for yes, 0 for no)"
      type: integer
      format: int32
    gscVoiceDirectory:
      description: "Directory of the voice files. Empty: radiopaging/voice in the application data directory"
      type: string
    gscVoiceKeepDays:
      description: "Voice files older than this many days are deleted when a new voice file is written (0 to keep them all). The newest gscVoiceKeepMin files are kept whatever their age"
      type: integer
      format: int32
    gscVoiceKeepMin:
      description: "The number of the newest voice files that are not deleted"
      type: integer
      format: int32
    channelAlias:
      description: "Name of the demodulator, set in the channel alias of every message record and in the names of the voice files. Empty: the frequency of the channel in Hz"
      type: string
    volume:
      description: Voice audio gain
      type: number
      format: float
    audioDeviceName:
      type: string
    rgbColor:
      type: integer
      format: int32
    title:
      type: string
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
      format: int32
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      format: int32
    reverseAPIAddress:
      type: string
    reverseAPIPort:
      type: integer
      format: int32
    reverseAPIDeviceIndex:
      type: integer
      format: int32
    reverseAPIChannelIndex:
      type: integer
      format: int32
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"

RadioPagingDemodReport:
  description: Radio paging demodulator
  type: object
  properties:
    channelPowerDB:
      description: Power received in channel (dB)
      type: number
      format: float
    channelSampleRate:
      type: integer
      format: int32
    pocsag512Sync:
      description: "POCSAG 512 bit/s decoder: 0 not synchronised, 1 synchronised, 2 synchronised on inverted polarity"
      type: integer
      format: int32
    pocsag1200Sync:
      description: "POCSAG 1200 bit/s decoder: 0 not synchronised, 1 synchronised, 2 synchronised on inverted polarity"
      type: integer
      format: int32
    pocsag2400Sync:
      description: "POCSAG 2400 bit/s decoder: 0 not synchronised, 1 synchronised, 2 synchronised on inverted polarity"
      type: integer
      format: int32
    flexSync:
      description: "FLEX decoder: 0 not synchronised, 1 synchronised, 2 synchronised on inverted polarity"
      type: integer
      format: int32
    flexMode:
      description: FLEX mode of the last frame
      type: string
    flexQuality:
      description: FLEX decode quality of the last frame, 0 to 1
      type: number
      format: float
    flexErs:
      description: "A FLEX emergency re-synchronization is being received (1 for yes, 0 for no)"
      type: integer
      format: int32
    flexErsSeconds:
      description: Length of the current or last FLEX emergency re-synchronization in seconds
      type: number
      format: float
    flexErsCount:
      description: Number of FLEX emergency re-synchronizations received since start
      type: integer
      format: int64
    gscSync:
      description: "GSC decoder: 0 not synchronised, 1 synchronised, 2 synchronised on inverted polarity"
      type: integer
      format: int32
    gscVoice:
      description: "A GSC voice message is being received (1 for yes, 0 for no)"
      type: integer
      format: int32
    pocsagMessages:
      description: Number of POCSAG messages decoded since start
      type: integer
      format: int64
    flexMessages:
      description: Number of FLEX messages decoded since start
      type: integer
      format: int64
    gscMessages:
      description: Number of GSC messages decoded since start
      type: integer
      format: int64
