CellularSettings:
  description: "Cellular base station controller: the NMT networks it runs on the Cellular Rx and Cellular Tx channels"
  properties:
    leadMs:
      type: integer
      description: "Lead of the transmitters over the receivers in ms (part of the round trip). Taken when the controller starts."
      minimum: 20
      maximum: 1000
    logEnabled:
      type: integer
      description: "Write the log also into the file logFilename (1 enabled, 0 disabled): CSV with the columns Date, Time, Network, Kind, Text, appended to."
    logFilename:
      type: string
      description: "Log file name or path."
    networks:
      description: "The networks. When present the list replaces the networks of the controller; while it runs, networks that are switched on start and networks that are switched off or not in the list stop."
      type: array
      items:
        $ref: "/doc/swagger/include/Cellular.yaml#/CellularNetworkSettings"
    mobiles:
      description: "The book of phones. When present, each item merges into the book by system and number (a phone that is not in the book is added); the fields given become typed values (an empty string gives the field back to learning). Phones are forgotten with the action forget. Changes of the book do not restart networks."
      type: array
      items:
        $ref: "/doc/swagger/include/Cellular.yaml#/CellularMobile"
    title:
      type: string
      description: "Title of the feature window."
    rgbColor:
      type: integer
      description: "Title color of the feature window (RGB)."

CellularMobile:
  description: "What the tester knows of a phone: values learned from it or typed by the user"
  properties:
    number:
      type: string
      description: "Country digit and six digits."
    system:
      type: integer
      description: "0 NMT-450, 1 NMT-900."
    name:
      type: string
    notes:
      type: string
    password:
      type: string
      description: "Password K (three digits)."
    smsCentre:
      type: string
      description: "SMS centre of the phone: it reaches the centre on this number whatever the network's is."
    voiceMail:
      type: string
      description: "Number the phone calls for its voice mail."
    voiceMailCode:
      type: string
    typed:
      type: string
      description: "The fields typed by the user, comma separated (the others are learned). Read only."
    dialled:
      type: string
      description: "Numbers the phone dialled, the newest first. Read only."
    smsCentresUsed:
      type: string
      description: "Numbers it sent short messages to or fetched them from, with the traffic area. Read only."
    areas:
      type: string
      description: "Traffic areas (Y1 Y2) of the networks it was heard on, the newest first. Read only."

CellularNetworkSettings:
  description: "One NMT network (one base station) and the radios it runs on"
  properties:
    id:
      type: integer
      description: "Network id 1..200000, unique in the controller. The carrier ids are id * 10000 + channel number."
    name:
      type: string
      description: "Name of the network."
    enabled:
      type: integer
      description: "On the air while the controller runs (1) or not (0)."
      minimum: 0
      maximum: 1
    system:
      type: integer
      description: "(0 NMT-450, 1 NMT-900, 2 AMPS)"
    sid:
      type: integer
      description: "AMPS: the system identification SID 0..32767."
    dcc:
      type: integer
      description: "AMPS: the digital colour code 0..3."
    scc:
      type: integer
      description: "AMPS: the SAT colour code 0..2 of the voice channels (a carrier may give its own: 356:vc:1)."
    country:
      type: string
      description: "Short name of the frequency plan: DK, SE, NO, FI, NL, HU ..."
    area:
      type: integer
      description: "Traffic area within the country (the second digit Y2)."
    y1:
      type: integer
      description: "Country digit Y1 in place of the country's (test network): 0..15 for NMT-450, 0..7 for NMT-900; -1 for the country's."
    areaNo:
      type: integer
      description: "Area number 1..4, 0 for none."
    msPower:
      type: integer
      description: "Power level of the phones 0..3 (3 is the highest)."
    carriers:
      type: string
      description: "The carriers, comma separated: channel:type[:supervisory]. Type (required): cc, cca, ccb, tc, actc, cctc or test; supervisory tone 1..4 on a traffic channel, 0 for none (given for every traffic channel or for none; when none is given the traffic channels get 1..4 in turn). Example: 1:cctc:1, 5:tc:2, 6:tc:3"
    compandor:
      type: integer
      description: "Compandor on speech (1) or not (0)."
    sendCallerId:
      type: integer
      description: "Send the number of the caller while the phone rings (1) or not (0)."
    sendClock:
      type: integer
      description: "Send the time of day (1) or not (0)."
    smscNumber:
      type: string
      description: "The number the phones send short messages to; empty for none."
    fallback:
      type: integer
      description: "What answers a call to a number that is not registered (0 echo, 1 music)."
    echoDelay:
      type: integer
      description: "Delay of the echo in ms (200..3000)."
    echoLevel:
      type: integer
      description: "Level of the echo in dB (-30..0)."
    echoAnnounce:
      type: integer
      description: "A short tone when the echo answers (1) or not (0)."
    musicSource:
      type: integer
      description: "Source of the music (0 built-in melody, 1 WAV file, 2 audio input)."
    musicFile:
      type: string
      description: "The WAV file played as music."
    musicInput:
      type: string
      description: "The audio input device played as music, by name; empty for the default."
    musicLevel:
      type: integer
      description: "Level of the music in dB (-30..0)."
    musicLoop:
      type: integer
      description: "Play the music in a loop (1) or once, then end the call (0)."
    callLimit:
      type: integer
      description: "The longest call to echo or music in seconds (0..3600), 0 for no limit."
    rxDeviceSetIndex:
      type: integer
      description: "Index of the device set with the Cellular Rx channel of the network."
    txDeviceSetIndex:
      type: integer
      description: "Index of the device set with the Cellular Tx channel of the network."

CellularReport:
  description: "Cellular base station controller report"
  properties:
    running:
      type: integer
      description: "The controller runs (1) or not (0)."
    networks:
      description: "The networks that run."
      type: array
      items:
        $ref: "/doc/swagger/include/Cellular.yaml#/CellularNetworkReport"

CellularNetworkReport:
  description: "The state of one network"
  properties:
    id:
      type: integer
      description: "Network id."
    onAir:
      type: integer
      description: "The network is on the air (1) or not (0)."
    summary:
      type: string
      description: "One line of the state of the network."
    registered:
      type: integer
      description: "Number of phones that registered."
    calls:
      type: integer
      description: "Number of calls in progress."
    carriers:
      type: array
      items:
        $ref: "/doc/swagger/include/Cellular.yaml#/CellularCarrierReport"
    phones:
      description: "Phones the network heard or registered."
      type: array
      items:
        $ref: "/doc/swagger/include/Cellular.yaml#/CellularPhoneReport"

CellularPhoneReport:
  description: "A phone a network heard (its identity in a frame a channel took) or registered"
  properties:
    number:
      type: string
      description: "Country digit and six digits."
    registered:
      type: integer
      description: "The phone made a roaming update to this network (1) or not (0)."
    channel:
      type: integer
      description: "Channel the phone was last heard on."
    state:
      type: string
      description: "What the phone does now on the channels, empty if nothing."
    lastHeard:
      type: string
      description: "Time the phone was last heard (ISO 8601), empty if not heard since the network started."
    level:
      type: number
      format: float
      description: "Received level of the channel then, in dB of full scale."
    quality:
      type: number
      format: float
      description: "Quality of the last frame of the phone, 0..1."
    power:
      type: integer
      description: "Power level 0..3 in the frames of the phone (0, 1 low, 2 medium, 3 high), -1 if not known."
    lastFrame:
      type: string
      description: "Type of the last frame of the phone."
    password:
      type: string
      description: "Password K of the phone (three digits) as its frames show it, empty if not known."
    dialled:
      type: string
      description: "Numbers the phone dialled, the newest first, comma separated."
    smsCentre:
      type: string
      description: "Numbers the phone sent short messages to or asked for its waiting messages on, with the traffic area of the network, comma separated."
    held:
      type: integer
      description: "Short messages the SMS centre keeps for the phone until it fetches them."
    pendingIndicators:
      type: integer
      description: "Message waiting indicators postponed until the phone is free (flags: 1 SMS, 2 voice mail, 4 fax, 8 e-mail, 16 data)."

CellularActions:
  description: "Cellular actions: the tester acts on a phone of a network"
  properties:
    networkId:
      type: integer
      description: "Id of the network."
    action:
      type: string
      description: >
        call (the network calls the phone, registered or not; the far end is echo or music),
        hangup (ends that call), release (releases any call of the phone), sms (text to the phone),
        mwi (message waiting indicators, value: flags; text for a phone in a call: incall or
        clearing, empty for both), power (level 0..3 of the phone in its call),
        move (the call to another traffic channel, value: channel, 0 for any free one),
        hold (text the SMS centre keeps until the phone calls it for its waiting messages),
        forget (the phone's record in the book; the system is the one of the network),
        audit (AMPS: the phone confirms it is there, idle or in its call),
        disabledtmf (AMPS: the phone in its conversation mutes its touch tones until it has sent the
        called address after its next flash).
        On AMPS mwi is the message waiting order (value: the count 0..31, 0 clears; text: voice,
        sms or fax, empty for voice), power the level 0..7, sms the flash with info (1..33 ASCII
        characters to the display of the phone that rings or talks), move the handoff to that voice
        channel; hold is NMT's.
    number:
      type: string
      description: "Number of the phone: NMT the country digit and six digits, AMPS the 10 digits."
    text:
      type: string
      description: "Text of the short message (sms), when the indicators go (NMT mwi) or their type (AMPS mwi)."
    value:
      type: integer
      description: "Flags (NMT mwi), the count (AMPS mwi), power level (power) or channel (move)."

CellularCarrierReport:
  description: "The state of one carrier of a network"
  properties:
    channel:
      type: integer
      description: "Channel number."
    type:
      type: string
      description: "Type of the channel as in the network's carriers (NMT CC, TC, AC/TC, CC/TC; AMPS CC/PC, VC)."
    downlink:
      type: integer
      format: int64
      description: "Frequency of the base station in Hz."
    uplink:
      type: integer
      format: int64
      description: "Frequency of the phone in Hz."
    state:
      type: string
      description: "State of the channel, or off with the reason."
    rxLevel:
      type: number
      format: float
      description: "Received level in dB of full scale."
    txFillMs:
      type: number
      format: float
      description: "Audio in the queue of the transmitter in ms."
    underruns:
      type: integer
      description: "Times the queue of the transmitter ran empty."
    phone:
      type: string
      description: "Number of the phone the channel serves, empty for none."
    framesReceived:
      type: integer
      format: int64
      description: "Frames received on the channel since the network started (any phone, any type)."
